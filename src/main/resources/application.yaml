spring:
  application:
    name: unishare

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  profiles:
    active: dev

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

file:
  upload-dir: uploads